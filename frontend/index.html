<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line Trade LLM — ライン管理</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1>Line Trade LLM</h1>
    <div class="controls">
      <label>API Base <input id="apiBase" type="text" value="http://localhost:8787" /></label>
      <label>Symbol <input id="symbol" type="text" value="BTC" /></label>
      <label>時間足
        <select id="interval">
          <option value="1">1分</option>
          <option value="3">3分</option>
          <option value="5">5分</option>
          <option value="15" selected>15分</option>
          <option value="30">30分</option>
          <option value="60">1時間</option>
          <option value="120">2時間</option>
          <option value="240">4時間</option>
          <option value="480">8時間</option>
          <option value="720">12時間</option>
          <option value="1440">日足</option>
        </select>
      </label>
      <button id="reload">読み込み</button>
    </div>
  </header>

  <div class="draw-controls">
    <span>ライン描画モード:</span>
    <button id="modeHorizontal" data-mode="horizontal">水平線 (1クリック)</button>
    <button id="modeTrend" data-mode="trend">トレンドライン (2クリック)</button>
    <button id="modeNone" data-mode="none" class="active">なし</button>
    <label title="この時間足が確定するたびにLLMがラインの状態を判定します">判定足 <select id="checkInterval"></select></label>
    <button id="deleteSelected" class="danger" hidden>選択中のラインを削除</button>
    <span id="drawHint"></span>
  </div>

  <div id="chart"></div>

  <section>
    <h2>登録済みライン</h2>
    <table id="linesTable">
      <thead>
        <tr>
          <th>種別</th>
          <th>Symbol</th>
          <th>ポイント</th>
          <th>判定足</th>
          <th>状態</th>
          <th>作成日時</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="checksSection" hidden>
    <h2>判定履歴 <span id="checksLineLabel"></span></h2>
    <div class="checks-controls">
      <label><input id="checksChangesOnly" type="checkbox" /> 状態が変わった判定だけ表示</label>
      <button id="checksReload">更新</button>
    </div>
    <table id="checksTable">
      <thead>
        <tr>
          <th>足(確定)</th>
          <th>状態</th>
          <th>確信度</th>
          <th>理由</th>
          <th>送信したプロンプト</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="checksEmpty" class="muted" hidden>まだ判定がありません(価格がラインの近くにあるときだけ判定します)</p>
  </section>

  <script src="./app.js"></script>
</body>
</html>
