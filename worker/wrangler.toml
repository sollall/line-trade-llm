name = "line-trade-llm"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Runs every minute; each line is checked only when a candle of its own
# check_interval_minutes has just closed (catching up if a tick was missed).
[triggers]
crons = ["* * * * *"]

[vars]
# Which exchange to poll live. "hyperliquid" | "backpack".
EXCHANGE = "hyperliquid"
# Check timeframe (minutes) for lines created without one; also the default GET /candles timeframe.
DEFAULT_CHECK_INTERVAL_MINUTES = "15"
# How many recent closed candles are fed to the LLM per check.
CANDLE_WINDOW = "15"
# A line is only checked when it lies within the recent candles' low-high range widened by this
# fraction of the line value; farther lines are skipped without calling the LLM.
CHECK_MARGIN_PCT = "0.002"
CLAUDE_MODEL = "claude-sonnet-5"

# `wrangler d1 create line_trade_llm` then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "line_trade_llm"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# `wrangler kv namespace create LLM_CACHE` then paste the returned id here.
[[kv_namespaces]]
binding = "LLM_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (do NOT put these here): set with
#   wrangler secret put ANTHROPIC_API_KEY
